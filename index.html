:root{--bg:#0d0a09;--p:#1a1310;--o:#e8530e;--t:#e9e6e1;--m:#9b948c;--l:#2c221d}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:400 16px/1.7 AJ,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;color:inherit}
svg{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 5vw;background:#0d0a09ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--l)}
.logo{font-weight:700;font-size:1.7rem;letter-spacing:-1px;display:flex;align-items:center;gap:8px;direction:ltr}.logo svg{color:var(--o);width:30px;height:30px}
nav{display:flex;gap:22px;margin-inline-start:auto}nav a{color:var(--m);cursor:pointer}nav a:hover,nav a.on{color:var(--o)}
.btn{background:var(--o);color:#fff;padding:10px 22px;border-radius:10px;font-weight:600}.btn.g{background:var(--l)}.btn:disabled{opacity:.5}
.ic{background:var(--l);width:42px;height:42px;border-radius:10px;position:relative;display:grid;place-items:center}
.ic b{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--o);font-size:.7rem;border-radius:9px;min-width:18px;text-align:center}
@media(max-width:800px){nav{display:none}header{gap:10px}.logo{margin-inline-end:auto}}
.hero{padding:12vh 5vw 8vh;background:radial-gradient(circle at 80% 30%,#e8530e33,transparent 40%),radial-gradient(circle at 12% 18%,#fff2 1px,transparent 2px) 0 0/90px 90px}
.hero h1{font-size:clamp(2.2rem,7vw,5.6rem);line-height:1.1;font-weight:700;max-width:14em}.hero h1 span{color:var(--o);display:block}
.hero p{max-width:34em;color:var(--m);margin:22px 0 28px;font-size:1.1rem}
.sec{padding:40px 5vw}.sec h2{font-size:1.8rem;margin-bottom:18px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.chip{background:var(--p);border:1px solid var(--l);padding:7px 18px;border-radius:30px}.chip.on{background:var(--o);border-color:var(--o)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--p);border:1px solid var(--l);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{border-color:var(--o)}
.ph{aspect-ratio:1;background:#241a15 center/cover no-repeat;position:relative}.ph::after{content:"";position:absolute;inset:0}
.bd{color:#fff!important;position:absolute;top:10px;inset-inline-start:10px;background:var(--o);padding:2px 10px;border-radius:8px;font-size:.85rem;z-index:1}
.ci{padding:14px}.ci h3{font-size:1rem;font-weight:600}.pr{font-weight:700;color:var(--o);font-size:1.15rem}.pr s{color:var(--m);font-weight:400;font-size:.9rem;margin-inline-start:8px}
.ov{position:fixed;inset:0;background:#000b;z-index:50;display:none;overflow:auto;padding:4vh 4vw}.ov.on{display:block}
.box{background:var(--p);border:1px solid var(--l);border-radius:16px;max-width:980px;margin:auto;padding:24px;position:relative}
.x{position:absolute;top:12px;inset-inline-end:12px;background:var(--l);width:36px;height:36px;border-radius:50%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:760px){.two{grid-template-columns:1fr}}

ayment page shows the account or wallet number. Transfer the amount, then enter the transfer reference and upload the receipt image. Both are required before you can submit."],["هل رقم التحويل وصورة الإيصال مطلوبان؟","نعم، لا يمكن إرسال بيانات الدفع بدون رقم التحويل وصورة الإيصال. الصورة بصيغة JPG أو PNG أو WEBP وبحد أقصى 5 ميجا.","Are the reference and receipt image required?","Yes. Payment details cannot be sent without both. The image must be JPG, PNG or WEBP, up to 5 MB."],["لماذا لا يظهر سعر توصيل لمنطقتي؟","رسوم التوصيل تحددها الإدارة لكل مركز. إذا لم يظهر سعر لمنطقتك فالتوصيل غير متاح لها حالياً.","Why is there no delivery price for my area?","Delivery fees are set per area by the store. If no price shows for your area, delivery is not available there right now."],["هل يمكن استخدام كود الخصم أكثر من مرة؟","لا. كل كود خصم يُستخدم مرة واحدة لكل حساب.","Can I reuse a discount code?","No. Each discount code can be used once per account."],["أين أجد فاتورتي وطلباتي؟","من صفحة حسابي ستجد قائمة طلباتك بحالة كل طلب. تصبح الفاتورة جاهزة للتحميل بعد موافقة الإدارة على الدفع.","Where are my invoice and orders?","Open My account to see your orders and their status. The invoice is ready to download after the payment is approved."],["كيف أطلب استبدال أو إرجاع منتج؟","تواصل معنا على contact@sarmad.qd.je أو واتساب مع رقم الطلب، وسنرد عليك بالخطوات.","How do I ask for an exchange or return?","Contact us at contact@sarmad.qd.je or on WhatsApp with your order number and we will reply with the steps."],["كيف أتواصل مع الدعم؟","راسلنا على contact@sarmad.qd.je أو عبر واتساب، أو أرسل رسالة من صندوق الدعم في الموقع.","How do I contact support?","Email contact@sarmad.qd.je, message us on WhatsApp, or send a message from the support box on the site."],["نسيت كلمة المرور، ماذا أفعل؟","من نافذة تسجيل الدخول اضغط نسيت كلمة المرور، وسنرسل رابط الاستعادة إلى بريدك.","I forgot my password","In the login window choose Forgot password and we will email you a reset link."],["كيف أعدّل بياناتي
