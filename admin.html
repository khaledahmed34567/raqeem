const csv="\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n");const b=new Blob([csv],{type:"text/csv;charset=utf-8"});const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="raqeem-"+k+"-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},500);toast("تم تجهيز الملف ("+(rows.length-1)+")")}catch(e){toast("تعذر التصدير")}};
window.waLink=o=>{try{let n=String(o.phone||"").replace(/\D/g,"");if(n.startsWith("00"))n=n.slice(2);else if(n.startsWith("0"))n="20"+n.slice(1);const st=["وصلنا طلبك وبنراجعه","بنجهز طلبك دلوقتي","طلبك خرج للتوصيل","طلبك اتسلم، شكرا ليك"][o.status||0]||"";const m="أهلا "+(o.name||"")+"، "+st+".\nرقم الطلب: "+ser(o)+"\nالإجمالي: "+o.total+" ج.م\nتابع طلبك: https://raqeem.qd.je/";return"https://wa.me/"+n+"?text="+encodeURIComponent(m)}catch(e){return"#"}};
window.stkCtl=p=>{const n=p.stock==null||p.stock===""?null:Number(p.stock);return`<div class="r" onclick="event.stopPropagation()" style="gap:6px;justify-content:flex-start;margin-top:6px"><span class="m">المخزون:</span><button class="chip" onclick="stkSet('${esc(p.id)}',${n==null?0:Math.max(0,n-1)})">-</button><b style="min-width:42px;text-align:center;color:${n===0?"#ff6b6b":n!=null&&n<=5?"#f08a24":"inherit"}">${n==null?"∞":n}</b><button class="chip" onclick="stkSet('${esc(p.id)}',${n==null?1:n+1})">+</button>${n!=null?`<button class="chip" onclick="stkSet('${esc(p.id)}',null)">∞</button>`:""}</div>`};
